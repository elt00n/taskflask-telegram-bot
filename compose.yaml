services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskflask
      POSTGRES_USER: taskflask
      POSTGRES_PASSWORD: taskflask
    ports:
      - "5432:5432"
    volumes:
      - taskflask_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflask -d taskflask"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskflask_postgres_data:
